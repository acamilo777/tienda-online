<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Productos</title></head>
<body>
<h2>Lista de Productos</h2>
<a href="/productos/nuevo">Agregar nuevo producto</a>
<table border="1">
    <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr>
    <tr th:each="producto : ${productos}">
        <td th:text="${producto.id}">1</td>
        <td th:text="${producto.nombre}">Nombre</td>
        <td th:text="${producto.precio}">0.0</td>
        <td th:text="${producto.stock}">0</td>
    </tr>
</table>
</body>
</html>
